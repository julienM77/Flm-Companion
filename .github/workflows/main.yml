name: Release Flm Companion

on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Build Tauri app
        working-directory: src
        run: npm run tauri build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/src-tauri/target/release/bundle/nsis/*.exe
          #  src/src-tauri/target/release/flm-manager.exe
          #  src/src-tauri/target/release/bundle/msi/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true

  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Build Linux bundles
        working-directory: src
        run: npm run tauri build -- --bundles appimage,deb

      - name: Add Linux packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/src-tauri/target/release/bundle/appimage/*.AppImage
            src/src-tauri/target/release/bundle/deb/*.deb
